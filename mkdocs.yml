site_name: Dartness 설계 문서
site_description: 사람이 읽는 기준 문서와 에이전트의 지식 지도
site_url: https://yujaeyun.github.io/Dartness/
repo_url: https://github.com/YUJAEYUN/Dartness
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  font: false
  palette:
    primary: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/mermaid.mjs
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
nav:
  - 시작: index.md
  - 시스템 상태: system-status.md
  - 작업 브리핑:
      - "#60 계정명 앞의 목차 기호 읽기": briefings/0060-leading-item-numbers.md
      - "#54 공시 후보의 범위와 근거": briefings/0054-disclosure-candidates.md
      - "#53 현금 표 추출 두 번째 평가": briefings/0053-cash-table-second-evaluation.md
      - "#51 조회 입력과 날짜 선택": briefings/0051-query-contract.md
      - "#48 조회 시점과 허용 개월": briefings/0048-query-time-options.md
      - "#46 공통 조회 정책": briefings/0046-common-query-policy.md
      - 양식과 목록: briefings/index.md
      - "#28 현금 금액 읽기": briefings/0028-cash-table.md
      - "#43 평가용 공시 수집": briefings/0043-evaluation-collection.md
      - "#45 현금 표 추출 첫 평가": briefings/0045-cash-table-evaluation.md
      - "#49 DART 표 칸·주석 번호": briefings/0049-dart-cells-and-note-labels.md
      - "#30 대시보드 상태": briefings/0030-dashboard-sync.md
      - "#33 조회 유형 명세": briefings/0033-query-types.md
      - "#34 이슈 자동 종료 차단": briefings/0034-issue-autoclose.md
  - 에이전트 위임 범위: delegation.md
  - 관리 화면 설계: management-screen.md
  - DART 실제 수집 검사: dart-live-check.md
  - 테스트 작성 방법: testing.md
  - 평가 기록:
      - 현금 표 추출 첫 평가: evaluations/cash-table-dart-2025.md
      - 현금 표 추출 두 번째 평가: evaluations/cash-table-dart-2025-second.md
  - 실제 공시 사례: cases/helixmith-cash.md
  - 금액 단위 처리: amounts.md
  - 합의한 요구사항: requirements.md
  - 올인원 조회 유형: query-types.md
  - 공통 조회·출력 계약: common-query-contract.md
  - 에이전트 개발 원칙: engineering-principles.md
  - 현금 조회 계약 초안: cash-query-contract.md
  - 현금 표 추출: cash-table-extraction.md
  - 구조와 판단 경계: architecture.md
  - 결과물 예시: output-example.md
  - 문서 운영과 메모리: documentation.md
  - CI와 브랜치 설정: ci.md
  - 개발 작업 흐름: development-workflow.md
  - 정합성 검토: consistency.md
  - 기록 양식:
      - 실행 평가: record-forms/evaluation.md
      - 공시 테스트 사례: record-forms/test-case.md
      - 설계 결정: record-forms/decision.md
      - 정합성 검토: record-forms/consistency-review.md
  - LLM 위키: wiki/index.md
  - 다음 작업: work-state.md
  - 검토 중인 제안: development-environment-proposal.md

site_name: Dartness 설계 문서
site_description: 사람이 읽는 기준 문서와 에이전트의 지식 지도
site_url: https://yujaeyun.github.io/Dartness/
repo_url: https://github.com/YUJAEYUN/Dartness
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  font: false
  palette:
    primary: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/mermaid.mjs
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
nav:
  - 시작: index.md
  - 시스템 상태: system-status.md
  - 요구사항과 계약:
      - 금액 단위 처리: specs/amounts.md
      - 합의한 요구사항: specs/requirements.md
      - 올인원 조회 유형: specs/query-types.md
      - 공통 조회·출력 계약: specs/common-query-contract.md
      - 공통 공시 목록 수집: specs/disclosure-list.md
      - 지정 공시 현금 조건 실행: specs/cash-report-slice.md
      - 정정 전후 현금 비교: specs/correction-cash-comparison.md
      - 원본·정정 근거 계약: specs/correction-evidence.md
      - 최신 유효 현금 자료 선택: specs/latest-cash-source.md
      - 저장 수집 자료의 조회 실행: specs/cash-bundle-runner.md
      - 모집단 현금 조회와 통합 결과: specs/cash-survey.md
      - 실행일 상장법인 연결: specs/listed-universe.md

site_name: Dartness 설계 문서
site_description: 사람이 읽는 기준 문서와 에이전트의 지식 지도
site_url: https://yujaeyun.github.io/Dartness/
repo_url: https://github.com/YUJAEYUN/Dartness
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  font: false
  palette:
    primary: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/mermaid.mjs
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
nav:
  - 시작: index.md
  - DART 실제 수집 검사: dart-live-check.md
  - 테스트 작성 방법: testing.md
  - 실제 공시 사례: cases/helixmith-cash.md
  - 금액 단위 처리: amounts.md
  - 합의한 요구사항: requirements.md
  - 구조와 판단 경계: architecture.md
  - 결과물 예시: output-example.md
  - 문서 운영과 메모리: documentation.md
  - CI와 브랜치 설정: ci.md
  - 개발 작업 흐름: development-workflow.md
  - 정합성 검토: consistency.md
  - 기록 양식:
      - 공시 테스트 사례: record-forms/test-case.md
      - 설계 결정: record-forms/decision.md
      - 정합성 검토: record-forms/consistency-review.md
  - LLM 위키: wiki/index.md
  - 다음 작업: work-state.md
  - 검토 중인 제안: development-environment-proposal.md

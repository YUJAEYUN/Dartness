site_name: Dartness 설계 문서
site_description: 사람이 읽는 기준 문서와 에이전트의 지식 지도
site_url: https://yujaeyun.github.io/Dartness/
repo_url: https://github.com/YUJAEYUN/Dartness
edit_uri: edit/main/docs/
theme:
  name: material
  language: ko
  font: false
  palette:
    primary: teal
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - javascripts/mermaid.mjs
extra_css:
  - stylesheets/extra.css
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
nav:
  - 시작: index.md
  - 시스템 상태: system-status.md
  - 요구사항과 계약:
      - 금액 단위 처리: specs/amounts.md
      - 합의한 요구사항: specs/requirements.md
      - 올인원 조회 유형: specs/query-types.md
      - 공통 조회·출력 계약: specs/common-query-contract.md
      - 공통 공시 목록 수집: specs/disclosure-list.md
      - 실행일 상장법인 연결: specs/listed-universe.md
      - 현금 조회 계약 초안: specs/cash-query-contract.md
      - 현금 표 추출: specs/cash-table-extraction.md
      - 결과물 예시: specs/output-example.md
  - 설계와 조사:
      - 관리 화면 설계: design/management-screen.md
      - 대시보드 코드 배치: design/dashboard-structure.md
      - 에이전트 작업 진입점: design/agent-entrypoint.md
      - 원본·정정공시 조사: design/correction-linking.md
      - 에이전트 개발 원칙: design/engineering-principles.md
      - 구조와 판단 경계: design/architecture.md
      - 문서 운영과 메모리: design/documentation.md
      - 검토 중인 제안: design/development-environment-proposal.md
  - 실행과 개발 방법:
      - 에이전트 위임 범위: guides/delegation.md
      - DART 실제 수집 검사: guides/dart-live-check.md
      - 상장법인 실제 연결 검증: guides/listed-live-check.md
      - 테스트 작성 방법: guides/testing.md
      - 예외 처리와 검사 우회: guides/quality-guards.md
      - CI와 브랜치 설정: guides/ci.md
      - 개발 작업 흐름: guides/development-workflow.md
  - 작업 브리핑:
      - "#85 실행일 상장법인 연결": briefings/0085-listed-universe.md
      - "#83 공통 공시 목록 수집": briefings/0083-disclosure-list.md
      - "#81 예외 처리·새 우회 검사": briefings/0081-quality-guards.md
      - "#79 에이전트 작업 진입점": briefings/0079-agent-entrypoint.md
      - "#77 대시보드 기능별 폴더": briefings/0077-dashboard-features.md
      - "#75 문서 폴더 정리": briefings/0075-docs-layout.md
      - "#70 최신 GitHub 상태 확인": briefings/0070-dashboard-live-state.md
      - GitHub 조회 장애와 배포: briefings/0071-build-snapshot-fallback.md
      - "#73 작업 결과 확인": briefings/0073-work-results.md
      - "#68 외화 공시 등을 미결로 두기": briefings/0068-deferred-foreign-currency.md
      - "#66 12월이 아닌 결산 법인 평가": briefings/0066-non-december-evaluation.md
      - "#65 정정 전체 자료와 정답": briefings/0065-correction-case.md
      - "#63 12월이 아닌 결산 법인 수집": briefings/0063-fiscal-month-collection.md
      - "#62 원본·정정공시 조사": briefings/0062-correction-linking.md
      - "#60 계정명 앞의 목차 기호 읽기": briefings/0060-leading-item-numbers.md
      - "#54 공시 후보의 범위와 근거": briefings/0054-disclosure-candidates.md
      - "#53 현금 표 추출 두 번째 평가": briefings/0053-cash-table-second-evaluation.md
      - "#51 조회 입력과 날짜 선택": briefings/0051-query-contract.md
      - "#48 조회 시점과 허용 개월": briefings/0048-query-time-options.md
      - "#46 공통 조회 정책": briefings/0046-common-query-policy.md
      - 양식과 목록: briefings/index.md
      - "#28 현금 금액 읽기": briefings/0028-cash-table.md
      - "#43 평가용 공시 수집": briefings/0043-evaluation-collection.md
      - "#45 현금 표 추출 첫 평가": briefings/0045-cash-table-evaluation.md
      - "#49 DART 표 칸·주석 번호": briefings/0049-dart-cells-and-note-labels.md
      - "#30 대시보드 상태": briefings/0030-dashboard-sync.md
      - "#33 조회 유형 명세": briefings/0033-query-types.md
      - "#34 이슈 자동 종료 차단": briefings/0034-issue-autoclose.md
  - 작업 결과 확인: work-results.md
  - 평가 기록:
      - 현금 표 추출 첫 평가: evaluations/cash-table-dart-2025.md
      - 현금 표 추출 두 번째 평가: evaluations/cash-table-dart-2025-second.md
      - 현금 표 추출 세 번째 평가: evaluations/cash-table-dart-2025-third.md

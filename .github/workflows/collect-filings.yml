name: Collect DART filings
# Manual evaluation source collection (issue #31, docs/guides/dart-live-check.md).
# Saves originals to a separate data branch that is never merged into main.
on:
  workflow_dispatch:
    inputs:
      collection_mode:
        description: '수집 방식: 기존 연간 평가 자료 또는 지정 접수번호 원문'
        type: choice
        options: [annual, exact_receipts, filing_history, small_cash_e2e, universe_cash]
        default: annual
      universe_cash_config:
        description: 'universe_cash 전용: 명시적 조건·예산 JSON (공개 평가 자료만)'
        required: false
        default: ''
      reuse_run_id:
        description: 'small_cash_e2e 전용: 같은 날짜에 수집한 원천의 실행번호, 비우면 새 수집'
        required: false
        default: ''
      receipt_numbers:
        description: 'exact_receipts에서만 사용: 접수번호 쉼표 구분, 최대 2건'
        required: false
        default: ''
      history_corp_code:
        description: 'filing_history 전용: DART 법인 코드 8자리'
        required: false
        default: ''
      history_start:
        description: 'filing_history 전용: 공시 검색 시작일 YYYY-MM-DD'
        required: false
        default: ''
      history_end:
        description: 'filing_history 전용: 공시 검색 종료일 YYYY-MM-DD'
        required: false
        default: ''
      stock_codes:
        description: '종목코드 (쉼표로 구분, 최대 8개)'
        required: true
        default: '005930,004370,068270,035720,000720,058470'
      business_year:
        description: '사업연도 (결산일이 속한 해, 결산월은 기업개황으로 확인)'
        required: true
        default: '2025'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.collection_mode == 'universe_cash' && 60 || 10 }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing workbook dependencies for the live sample
        if: inputs.collection_mode == 'small_cash_e2e' || inputs.collection_mode == 'universe_cash'
        run: python -m pip install -r requirements.txt
      - name: Read explicitly selected prior sample sources
        if: inputs.collection_mode == 'small_cash_e2e' && inputs.reuse_run_id != ''
        env:
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]{1,20}$ ]] || exit 1
          mkdir -p "$RUNNER_TEMP/reuse-sources"
          git fetch origin "refs/heads/data/dart-filings-$REUSE_RUN_ID"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/reuse-sources"
      - name: Run bounded live cash sample
        if: inputs.collection_mode == 'small_cash_e2e'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STOCK_CODES: ${{ inputs.stock_codes }}
          HISTORY_START: ${{ inputs.history_start }}
          HISTORY_END: ${{ inputs.history_end }}
          OUTPUT_DIR: ${{ runner.temp }}/filings
          REUSE_DIR: ${{ inputs.reuse_run_id != '' && format('{0}/reuse-sources', runner.temp) || '' }}
          PYTHONPATH: src
        run: timeout --signal=TERM --kill-after=5s 360s python -m dartness.small_cash_e2e
      - name: Run explicitly configured current-universe cash evaluation
        if: inputs.collection_mode == 'universe_cash'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          UNIVERSE_CASH_CONFIG: ${{ inputs.universe_cash_config }}
          HISTORY_START: ${{ inputs.history_start }}
          OUTPUT_DIR: ${{ runner.temp }}/filings
          PYTHONPATH: src
        run: timeout --signal=TERM --kill-after=5s 3000s python -m dartness.universe_cash_runner
      - name: Collect filings with the repository OpenDART key
        if: inputs.collection_mode != 'small_cash_e2e' && inputs.collection_mode != 'universe_cash'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          COLLECTION_MODE: ${{ inputs.collection_mode }}
          HISTORY_CORP_CODE: ${{ inputs.history_corp_code }}
          HISTORY_START: ${{ inputs.history_start }}
          HISTORY_END: ${{ inputs.history_end }}
          RECEIPT_NUMBERS: ${{ inputs.receipt_numbers }}
          STOCK_CODES: ${{ inputs.stock_codes }}
          BUSINESS_YEAR: ${{ inputs.business_year }}
          OUTPUT_DIR: ${{ runner.temp }}/filings
          PYTHONPATH: src
        run: python -m dartness.dart_collect
      - name: Push to a data branch
        if: success() || (always() && (inputs.collection_mode == 'small_cash_e2e' || inputs.collection_mode == 'universe_cash'))
        env:
          FILINGS: ${{ runner.temp }}/filings
        run: |
          if [ ! -d "$FILINGS" ]; then
            echo "No captured files to preserve"
            exit 0
          fi
          branch="data/dart-filings-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$branch"
          git rm -rq --cached .
          git clean -fdxq
          cp -R "$FILINGS"/. .
          git add -A
          git commit -qm "DART filings for evaluation (run ${GITHUB_RUN_ID})"
          git push origin "HEAD:refs/heads/$branch"
          echo "Pushed $branch"

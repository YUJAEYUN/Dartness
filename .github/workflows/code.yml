name: Check code
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      dart_smoke:
        description: 'DART 실제 공시 1건 수집 (시크릿 필요)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  code-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Check issue closure policy
        if: github.event_name == 'pull_request'
        run: python scripts/check_pr_policy.py "$GITHUB_EVENT_PATH"
      - name: Check work briefing for feature and specification PRs
        if: github.event_name == 'pull_request'
        run: python scripts/check_briefing_required.py "$GITHUB_EVENT_PATH"
      - name: Check one open PR per issue
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.check_issue_claim "$GITHUB_EVENT_PATH"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - name: Check newly added quality bypasses
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.check_quality_changes --base "$BASE_SHA" --head "$HEAD_SHA"
      - run: npm run docs:check
        working-directory: dashboard
      - run: npm run lint && npm test && npm run build
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: management-dashboard
          path: dashboard/dist/
          if-no-files-found: error
          retention-days: 7

  dart-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.dart_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect one DART filing
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONPATH: src
        run: python -m dartness.dart_smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dart-smoke-${{ github.run_id }}
          path: work/dart-smoke/
          if-no-files-found: error
          retention-days: 3

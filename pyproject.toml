[project]
name = "dartness"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.mutmut]
# Trial scope agreed in issue #41. Install requirements-mutation.txt, then python -m mutmut run (docs/guides/testing.md).
paths_to_mutate = ["src/dartness/cash_table.py"]
tests_dir = ["tests/"]
also_copy = ["src/", "docs/", "tests/"]
pytest_add_cli_args_test_selection = ["tests/test_cash_table.py"]
